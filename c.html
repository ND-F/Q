<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    
    <title>NADIM in the Museum of Islamic Art - نديم في متحف الفن الإسلامي</title>
    
    <meta name="theme-color" content="#EAE8D8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#06444C" media="(prefers-color-scheme: dark)">
    
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-gold.svg?v=2" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-teal.svg?v=2" media="(prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-gold.svg?v=2">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RWD0WHS7EV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RWD0WHS7EV');
    </script>

    <style>
        :root {
            --teal: #06444C;
            --beige: #EAE8D8;
            --gold: #E1A93E;
            --aqua: #ADCAC9;
            --burgundy: #4A121C;
            --midnight: #07181D;
            --offehite: #F5F1E8;
        }
        
        body { 
            margin: 0; font-family: 'Tajawal', sans-serif; 
            font-weight: 500; /* إجبار كل نصوص الموقع على Medium كبداية */
            background: var(--beige); color: var( --teal); 
            transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-top: 95px; 
        }
        body.dark { background: var( --teal); color: var(--beige); }
        
        
        /* ========================================== */
        /* نقش الخلفية لكامل الشاشة (اللايت والدارك) */
        /* ========================================== */
        body::before {
            content: "";
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            
            background-image: url('https://raw.githubusercontent.com/ND-F/Q/main/images/pattern-teal.svg?v=2');
            background-size: 80px 80px; /* قللنا الحجم لـ 55px عشان الأيقونات تقرب من بعضها (كانت 80) */
            background-position: center;
            
            opacity: 0.04; /*  ضاعفنا درجة الوضوح مرتين لـ 0.09 (كانت 0.03) */
            pointer-events: none; 
            z-index: -1; 
            transition: background-image 0.4s ease, opacity 0.4s ease;
        }

        body.dark::before {
            background-image: url('https://raw.githubusercontent.com/ND-F/Q/main/images/pattern-beige.svg?v=2');
            opacity: 0.02; /* زودنا الوضوح في وضع الدارك كمان */
        }
        
       
        /* ========================================== */
        /* الهيدر المطور */
        /* ========================================== */
        #museumHeader { 
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; 
            background: #EAE8D8 !important; 
            /* التعديل 1: خلينا البادينج 20px عشان يتساوى مع حواف الصفحة */
            padding: 15px 20px; 
            display: flex; flex-direction: column; 
            align-items: center; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            border-bottom: 1px solid var(--gold); 
            transition: all 0.3s ease;
            overflow: hidden; 
        }

        /* ========================================== */
        /* باترن الهيدر (متناسق مع الصورة المقصوصة) */
        /* ========================================== */
        .header-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('images/NADIM+MIA-icon.svg?v=6');
            background-size: 80px auto; 
            background-position: center; 
            opacity: 0.04; 
            pointer-events: none; z-index: 0;
        }

        .header-inner {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; max-width: 1200px; margin: 0 auto;
        }

        .logos-group {
            display: flex; align-items: center; gap: 00px;
            flex-shrink: 0; 
        }
        .logos-group a:first-child {
            margin-inline-end: 00px; 
            position: relative;
            z-index: 2;
        }

        .logo { 
            height: 65px; 
            width: auto; 
            cursor: pointer; 
            /* السطرين دول هم "السر" عشان اللوجو ميبكسلش وهو بيصغر ويكبر */
            image-rendering: -webkit-optimize-contrast; 
            transform: translateZ(0);
            /* لغينا الـ translateZ والـ cubic-bezier النطاط وخليناها ناعمة جداً */
            /* خلي الـ transition ناعم وبسيط */
            transition: height 0.3s ease-out, transform 0.3s ease-out;
        }

        .logo:hover {
            transform: scale(1.08); 
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.15)); 
        }

        .header-title { 
            font-size: 28px; font-weight: 800;
            color: var( --teal) !important; line-height: 1.2; 
            transition: all 0.3s ease; margin: 0;
            flex: 1 1 auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        body.lang-ar .header-title { text-align: right; }
        body.lang-en .header-title { text-align: left; }

        /* حالة السكرول للهيدر */
        #museumHeader.header-small { padding: 8px 20px !important; } /* وحدنا البادينج هنا كمان */
        #museumHeader.header-small .logo { height: 40px !important; }
        #museumHeader.header-small .header-title { font-size: 22px !important; }

        /* شاشات الموبايل */
        @media (max-width: 800px) {
            body { padding-top: 62px; } /* مسافة البودي للموبايل */
            
            #museumHeader { padding: 10px 20px; } 
            
            .header-inner { 
                display: flex; 
                flex-direction: row; 
                align-items: center; 
                justify-content: space-between; 
                gap: 10px;
            }
            
            .header-title { 
                font-size: 17px; 
                margin: 0; 
                flex: 1; 
            }
            
            .logos-group {
                position: static; width: auto;
                display: flex; flex-direction: row; justify-content: flex-end;
                gap: 10px; flex-shrink: 0;
            }
            
            .logo { height: 42px; }
            
            #museumHeader.header-small { padding: 6px 20px !important; }
            #museumHeader.header-small .logo { height: 32px !important; }
            #museumHeader.header-small .header-title { font-size: 14px !important; }

            /* مقاسات الكافر في الموبايل */
            .cover-banner { 
                height: 250px !important; 
            }
        }

       /* ========================================== */
        /* الكافر (Cover Banner) بوضعه الطبيعي (بينزل مع السكرول) */
        /* ========================================== */
        .cover-banner {
            width: 100%; /* 100% أفضل من 100vw لمنع سكرول العرض */
            height: 400px; 
            overflow: hidden; 
            position: relative; /* الكافر أصبح جزء من الصفحة وبيتحرك معاها */
            display: none;
            background: var( --beige);
            margin: 0; padding: 0;
            transition: background 0.4s ease; /* عشان يتغير بنعومة مع الثيم */
        }
        /* إضافة السطر ده عشان ياخد اللون الغامق في حالة الدارك مود */
        body.dark .cover-banner {
            background: var(--teal);
        }

        .cover-banner img { 
            width: 100%; height: 100%; 
            object-fit: cover !important; 
            object-position: center; 
            display: block; opacity: 1; 
        }

        .container { 
            max-width: 1200px; 
            /* المسافة هنا 40px هي المسافة بين الكافر والمحتوى */
            margin: 40px auto 100px; padding: 0 20px; 
            opacity: 0; position: relative;
            transition: opacity 0.5s ease; 
        }
        
        .container.ready { opacity: 1; }

        .info-toggle-btn {
            display: flex; position: fixed; top: 180px; 
            right: 0; left: auto;
            background: var(--gold); color: white; padding: 12px 15px;
            border-radius: 15px 0 0 15px; z-index: 990; cursor: pointer;
            box-shadow: -2px 2px 10px rgba(0,0,0,0.2); font-size: 20px;
            transform-origin: right center;
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        
        .info-toggle-btn::before {
            content: attr(data-tooltip); position: absolute; top: 50%; right: 120%; 
            transform: translateY(-50%) translateX(10px); 
            background: rgba(6, 68, 76, 0.50); /* الشفافية 50 */
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); /* تأثير الزجاج */
            color: var(--beige); 
            padding: 8px 15px; border-radius: 12px; font-size: 14px; white-space: nowrap; font-weight: 800;
            opacity: 0; visibility: hidden; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; font-family: 'Tajawal', sans-serif;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 1000;
        }
        
        .info-toggle-btn:hover::before,
        .info-toggle-btn.show-tooltip::before { 
            opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); 
        }

        .info-toggle-btn.mini:not(.close) {
            transform: scale(0.68);
            opacity: 0.24;
            background: rgba(225, 169, 62, 0.42);
            box-shadow: -2px 2px 8px rgba(0,0,0,0.08);
        }

        .info-toggle-btn.mini:not(.close):hover,
        .info-toggle-btn.mini:not(.close):focus-within {
            transform: scale(1);
            opacity: 1;
            background: var(--gold);
        }

        .info-toggle-btn.close {
            background: rgba(6, 68, 76, 0.22);
            color: rgba(255,255,255,0.92);
            box-shadow: -2px 2px 10px rgba(0,0,0,0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1002;
            transform: scale(1);
            opacity: 1;
        }

        body.dark .info-toggle-btn.close {
            background: rgba(234, 232, 216, 0.16);
            color: var(--beige);
        }

        .info-toggle-btn.close::before {
            display: none;
        }
        
        /* عنوان القطعة (Tajawal Black) */
        .article-header h1 { 
            font-size: 32px; 
            color: var(--burgundy) !important; 
            margin: 0 0 10px 0; 
            font-weight: 900; /* Black */
            line-height: 1.4; 
        }
        body.dark .article-header h1 { color: var(--gold) !important; }
        
        .title-separator { border: none; border-top: 2px solid rgba(225, 169, 62, 0.5); width: 40px; margin: 0 0 20px 0; }
        body.lang-ar .title-separator { margin-left: auto; margin-right: 0; }
        body.lang-en .title-separator { margin-left: 0; margin-right: auto; }

        /* مجموعة المعلومات الأساسية (Tajawal Medium) */
        .meta-group { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            font-size: 16px; 
            color: var( --teal); 
            opacity: 0.9; 
            line-height: 1.6; 
            font-weight: 500; /* Medium */
        }
        body.dark .meta-group { color: var(--beige); }
        .meta-item { display: block; }
        
        /* جعل الماتريال بنفس تنسيق المكان والتاريخ */
        .meta-material { 
            display: block; 
            /* شيلنا اللون الأحمر والخط التخين عشان يمشي مع الباقي */
        }

        /* القاعة (Tajawal Extra Bold) */
        #hall { 
            font-weight: 800; /* Extra Bold */
            color: var( --teal); 
            font-size: 18px; 
            margin-top: 5px; 
        }
        body.dark #hall { color: var(--aqua); }
        
        /* رقم الحفظ (بنفس روح العنوان Tajawal Black - وبحجم 18) */
        .meta-inv { 
            margin-top: 25px; 
            padding-top: 0px; 
            border-top: none; /* لغينا الخط القديم الطويل */
            
            font-size: 18px; /* حجم الماتريال القديم */
            color: var(--burgundy); /* لون العنوان */
            font-weight: 900; /* Black زي العنوان */
            font-family: 'Tajawal', serif; /* لغينا الـ sans-serif */
            opacity: 1; /* لغينا الشفافية */
        }
        /* إضافة الخط الذهبي القصير فوق رقم الحفظ */
        .meta-inv::before {
            content: "";
            display: block;
            border-top: 2px solid rgba(225, 169, 62, 0.5); /* نفس لون وسمك خط العنوان */
            width: 40px; /* نفس طول خط العنوان */
            margin-bottom: 15px; /* المسافة بين الخط والكلمة */
        }
        
        /* ضبط محاذاة الخط حسب اللغة */
        body.lang-ar .meta-inv::before { margin-left: auto; margin-right: 0; }
        body.lang-en .meta-inv::before { margin-left: 0; margin-right: auto; }
        
        /* رقم الحفظ في الدارك مود (لون ذهبي زي العنوان) */
        body.dark .meta-inv { 
            color: var(--gold) !important;
        }
        
        /* رقم الحفظ في الدارك مود (لون ذهبي زي العنوان) */
        body.dark .meta-inv { 
            border-top-color: rgba(255,255,255,0.1); 
            color: var(--gold) !important;
        }

        @media (min-width: 1000px) {
            /* توحيد المقاسات بين الهيدر والكونتينر بالمللي */
            .header-inner { max-width: 1400px; width: 100%; box-sizing: border-box; }
            
           /* ضبط اللوجوهات في الإنجليزي ومحاذاتها للشمال براحتك */
            body.lang-en .logos-group { 
                width: 320px; 
                box-sizing: border-box;
                padding-left: 60px !important; /* دي بتثبتهم عشان ميتزحلقوش وقت السكرول */
                justify-content: flex-start; 
                transform: none !important; 
                
                /* السر هنا: زق اللوجوهات شمال براحتك */
                position: relative;
                left: -00px; /* كبر الرقم ده بالسالب (مثلاً -30px أو -40px) عشان ترحلهم شمال أكتر لحد ما يظبطوا معاك */
            }
            /* ترحيل عنوان الهيدر ليكون محاذي للمتن (بالعربي والإنجليزي) */
            body.lang-ar .header-title { transform: translateX(-20px); } /* رحلناه يمين في العربي */
            body.lang-en .header-title { transform: translateX(20px); } /* رحلناه شمال في الإنجليزي */

            /* ⚠️ التعديل الجذري هنا: ضفنا box-sizing عشان الـ padding ميكبرش الكونتينر ويبوظ المحاذاة */
            .container { display: flex; align-items: flex-start; gap: 60px; justify-content: center; max-width: 1400px; box-sizing: border-box; } 
            body.lang-ar .container { flex-direction: row; } 
            body.lang-en .container { flex-direction: row-reverse; } 

            .article-header {
                width: 320px; flex-shrink: 0; position: sticky; top: 120px; text-align: inherit;
                background: transparent !important; padding: 0 !important; margin-bottom: 0 !important; z-index: 10;
                box-shadow: none; transition: none; left: auto !important; right: auto !important;
                height: auto; overflow-y: visible; 
            }
            body.lang-ar .article-header { text-align: right; }
            body.lang-en .article-header { text-align: left; }
            
            body.lang-ar .meta-group { align-items: flex-start; } 
            
            /* كبرنا مساحة الكتابة لـ 1050px بدل 800px */
            .article-content { flex-grow: 1; min-width: 0; max-width: 1050px; margin: 0 auto; } 
            .info-toggle-btn { display: none !important; }
        }

        
        @media (max-width: 999px) {
            .container { display: block; max-width: 800px; padding-top: 20px; }
            
            .article-header { 
                position: fixed; top: 0; 
                right: -100%; left: auto;
                width: 80%; max-width: 350px; height: 100vh; overflow-y: auto;
                background: var(--beige); z-index: 999; 
                padding: 100px 30px 40px; box-shadow: -5px 0 25px rgba(0,0,0,0.2);
                transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            }
            
            /* --- الووتر مارك النقش الخاص بدرج المعلومات --- */
            .article-header::before {
                content: "";
                position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                background-image: url('https://raw.githubusercontent.com/ND-F/Q/main/images/pattern-teal.svg?v=2');
                background-size: 55px 55px; 
                background-position: center;
                opacity: 0.05; 
                pointer-events: none; z-index: 0;
            }
            body.dark .article-header::before {
                background-image: url('https://raw.githubusercontent.com/ND-F/Q/main/images/pattern-beige.svg?v=2');
                opacity: 0.035;
            }
            /* رفع الكلام فوق الووتر مارك عشان يفضل مقروء */
            .article-header > * {
                position: relative; z-index: 1;
            }
            /* -------------------------------------- */

            body.dark .article-header { background: var( --teal); box-shadow: -5px 0 25px rgba(0,0,0,0.8); }
            body.lang-ar .article-header { text-align: right; }
            body.lang-en .article-header { text-align: left; }
            .article-header.open { right: 0; }
            .info-toggle-btn.hide { transform: scale(0); }
        }

        .image-pair-container { margin: 40px 0; width: 100%; text-align: center; display: block; }
        .image-pair-wrapper { display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; width: 100%; }
        
        .image-pair-wrapper img { 
            width: auto; max-width: 100%; height: auto; max-height: 65vh; object-fit: contain; 
            border-radius: 4px; box-shadow: none; border: none;
            cursor: zoom-in; transition: transform 0.3s;
        }
        body.dark .image-pair-wrapper img { box-shadow: none; border: none; }
        .image-pair-wrapper img:hover { transform: scale(1.02); }
        
        @media (min-width: 600px) {
            .image-pair-wrapper.has-double img { max-width: calc(50% - 10px); }
        }

        /* الشرح تحت الصور - باستخدام ألوان البراند مع شفافية بسيطة */
        figcaption { margin-top: 15px; font-size: 14px; color: var( --teal); font-weight: 500; opacity: 0.8; line-height: 1.5; }
        body.dark figcaption { color: var(--beige); opacity: 0.7; }
        body.lang-ar figcaption { text-align: right; border-right: 3px solid var(--gold); padding-right: 12px; }
        body.lang-en figcaption { text-align: left; border-left: 3px solid var(--gold); padding-left: 12px; }
        
        /* حقوق الصور - باستخدام ألوان البراند */
        .photo-credit { 
            display: block !important; margin-top: 15px; font-size: 13px; color: var( --teal); opacity: 0.75;
            font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 15px; 
            width: 100%; box-sizing: border-box; /* التعديل هنا: ضفنا box-sizing عشان الخط الدهبي ميحركش البوكس */
        }
        body.dark .photo-credit { color: var(--beige); opacity: 0.65; border-bottom: 1px solid rgba(255,255,255,0.1); }
        body.lang-ar .photo-credit { text-align: right; border-right: 3px solid var(--gold); padding-right: 12px; }
        body.lang-en .photo-credit { text-align: left; border-left: 3px solid var(--gold); padding-left: 12px; }

        /* نصوص المقالة الأساسية - لون صريح وقوي من البراند */
        .article-body p { font-size: 20px; line-height: 2.1; margin-bottom: 30px; color: var( --teal); text-align: justify; }
        body.dark .article-body p { color: var(--beige); }
        body.lang-en .article-body { direction: ltr; }
        body.lang-ar .article-body { direction: rtl; }

        .video-container { 
            width: 100%; 
            padding-bottom: 56.25%; 
            height: 0; 
            margin-bottom: 40px; 
            border-radius: 15px; 
            overflow: hidden; 
            position: relative; 
            display: none; 
            border: 2px solid var(--gold); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
        }
        
        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        .inline-video { margin-bottom: 30px !important; border-radius: 15px !important; }

        /* ===== عارض الريل (YouTube Shorts) طولي وأصغر ===== */
        .reel-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 40px;
            aspect-ratio: 9 / 16;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            display: none;
            border: 2px solid var(--gold);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .reel-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== ثامنيل يوتيوب (facade): صورة + زرار تشغيل، وبالكليك يشتغل inline ===== */
        .yt-facade {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; padding: 0; margin: 0; cursor: pointer; display: block;
            background-color: #000; background-size: cover; background-position: center;
        }
        .yt-facade .yt-play {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 68px; height: 48px; border-radius: 14px;
            background: rgba(0,0,0,0.62); transition: background 0.2s ease;
        }
        .yt-facade:hover .yt-play { background: var(--gold); }
        .yt-facade .yt-play::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-40%, -50%);
            border-style: solid; border-width: 11px 0 11px 19px;
            border-color: transparent transparent transparent #fff;
        }

        .main-figure { 
            width: 100%; margin: 0 0 30px 0; padding: 0; 
            display: block; text-align: center; /* التعديل هنا: لغينا الـ flex وخليناها block عشان الانفو بوكس ياخد راحته زي باقي الصور بالظبط */
        }
        .viewer { width: 100%; max-height: 65vh; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; }
        .viewer img { 
            max-width: 100%; max-height: 65vh; object-fit: contain; 
            box-shadow: none; border: none;
            border-radius: 4px; transition: opacity 0.4s ease; 
        }
        body.dark .viewer img { box-shadow: none; border: none; }

        
        .controls { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(10, 30, 35, 0.80) !important; backdrop-filter: blur(15px);
            padding: 12px 30px; border-radius: 50px; display: flex; align-items: center; gap: 25px; 
            z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid var(--gold) !important; 
            direction: ltr !important; transition: transform 0.35s ease, opacity 0.35s ease, bottom 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
        }
        .controls div { font-size: 24px; cursor: pointer; color: white !important; transition: 0.2s; position: relative; } 
        .controls .nav-btn { color: var(--gold) !important; font-size: 28px; }
        .controls .nav-btn.disabled { opacity: 0.15; pointer-events: none; }
        .controls .sep { width: 1px; height: 20px; background: rgba(225, 169, 62, 0.3) !important; }
        
        /* شريط الكنترول */
        .controls div:not(.sep) {
            transition: all 0.25s ease-out; 
            backface-visibility: hidden;
            will-change: transform; /* دي بتسرع الأداء بدون ما تبوظ البيكسلات */
        }

        .controls div:not(.sep):hover {
            transform: scale(1.15); 
            color: var(--gold) !important; 
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3)); 
        }

        .controls div:not(.sep):hover img {
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .controls > div:not(.sep)::before {
            content: attr(data-tooltip); position: absolute; bottom: 125%; left: 50%;
            transform: translateX(-50%) translateY(10px); 
            background: rgba(6, 68, 76, 0.50); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); /* تأثير الزجاج */
            color: var(--beige); 
            padding: 8px 15px; border-radius: 12px; font-size: 14px; white-space: nowrap; font-weight: 800;
            opacity: 0; visibility: hidden; transition: 0.3s; pointer-events: none; font-family: 'Tajawal', sans-serif;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .controls > div:not(.sep):hover::before { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        .controls.controls-mini {
            transform: translateX(-50%) scale(0.58);
            opacity: 0.16;
            bottom: 10px;
            background: rgba(10, 30, 35, 0.38) !important;
            border-color: rgba(225, 169, 62, 0.22) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .controls.controls-mini:hover,
        .controls.controls-mini:focus-within {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            bottom: 25px;
            background: rgba(10, 30, 35, 0.96) !important;
            border-color: var(--gold) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        #fullscreenModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.50); z-index: 10001; }
        body.dark #fullscreenModal { background: rgba(6, 68, 76, 0.50); }
        #modalContent { display: flex; height: 100%; align-items: center; justify-content: center; overflow: hidden; }
        #modalImage { max-width: 95%; max-height: 95%; object-fit: contain; cursor: grab; transform-origin: center center; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.2)); }
        #modalClose { position: absolute; top: 25px; right: 25px; font-size: 40px; color: var( --teal); cursor: pointer; z-index: 10002; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        body.dark #modalClose { color: white; }
        footer { display: block; width: 100%; clear: both; text-align: center; margin: 40px 0 120px 0; font-size: 13px; opacity: 0.4; }

        /* ===== قائمة التحميل (PDF / HTML) ===== */
        .dl-overlay { position: fixed; inset: 0; background: rgba(6,68,76,.45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .dl-menu { background: var(--beige); color: var(--teal); border: 1px solid var(--gold); border-radius: 18px; padding: 22px 18px; width: 260px; max-width: 84vw; box-shadow: 0 20px 60px rgba(0,0,0,.4); text-align: center; font-family: 'Tajawal', sans-serif; }
        body.dark .dl-menu { background: var(--teal); color: var(--beige); }
        .dl-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
        .dl-opt { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 13px; border: none; border-radius: 12px; background: var(--gold); color: #fff; font-size: 16px; font-weight: 700; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: transform .15s ease, filter .15s ease; }
        .dl-opt:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .dl-cancel { display: block; width: 100%; margin-top: 10px; padding: 10px; border: none; background: transparent; color: inherit; opacity: .7; font-size: 14px; font-family: 'Tajawal', sans-serif; cursor: pointer; }

        /* ===== طباعة / تصدير PDF بعرض المتصفح الأصلي (عربي سليم، مفيش قص، مفيش ورق أبيض) ===== */
        #printRoot { display: none; }
        @media print {
            @page { size: A4; margin: 0; }
            html, body { background: #EAE8D8 !important; margin: 0 !important; padding: 0 !important; }
            body > *:not(#printRoot) { display: none !important; }
            #printRoot { display: block !important; position: relative; padding: 14mm 12mm 16mm; box-sizing: border-box;
                color: #06444C; font-family: 'Tajawal', sans-serif; font-weight: 500; }
            #printRoot, #printRoot * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #printRoot::before { content: ""; position: fixed; inset: 0;
                background-image: url('images/pattern-teal.svg'); background-size: 80px 80px; opacity: 0.05; z-index: -1; }
            .pr-header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
                border-bottom: 1px solid #E1A93E; padding-bottom: 12px; margin-bottom: 22px; }
            .pr-section { font-size: 19px; font-weight: 800; color: #06444C; }
            .pr-logos { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
            .pr-logos img { height: 42px; width: auto; }
            .pr-meta { margin-bottom: 24px; }
            .pr-title { font-size: 26px; font-weight: 900; color: #4A121C; margin: 0 0 8px; line-height: 1.4; }
            .pr-rule { border-top: 2px solid rgba(225,169,62,.6); width: 40px; }
            .pr-metalines { font-size: 14px; line-height: 1.9; margin-top: 12px; }
            .pr-metalines > div { margin-bottom: 6px; }
            .pr-inv { color: #4A121C; font-weight: 900; font-size: 16px; margin-top: 8px; }
            .pr-body p { font-size: 15px; line-height: 2; margin: 0 0 14px; text-align: justify; }
            .pr-fig { margin: 0 0 18px; text-align: center; page-break-inside: avoid; }
            .pr-fig img { max-width: 100%; max-height: 150mm; border-radius: 6px; }
            .pr-cap { font-size: 12px; opacity: .85; margin-top: 6px; text-align: right; border-right: 3px solid #E1A93E; padding-right: 8px; }
            .pr-vid { display: block; position: relative; max-width: 150mm; margin: 0 auto 18px; page-break-inside: avoid; text-decoration: none; }
            .pr-vid img { width: 100%; border: 2px solid #E1A93E; border-radius: 8px; display: block; }
            .pr-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 60px; height: 42px; background: rgba(6,68,76,.72); border-radius: 12px; }
            .pr-play::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-38%,-50%);
                border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff; }
            body.lang-en .pr-cap { text-align: left; border-right: none; border-left: 3px solid #E1A93E; padding-right: 0; padding-left: 8px; }
        }
    </style>
</head>

<script>
    const systemLang = navigator.language.startsWith("ar") ? "ar" : "en";
    let lang = localStorage.getItem("nadim_lang") || systemLang;
    let allArtworks = [], artwork;
    let zoomStartTime = 0, isZoomTracked = false;

    const modal = document.getElementById("fullscreenModal"), modalImage = document.getElementById("modalImage");
    let controlsTimer;
    const controlsEl = document.querySelector('.controls');

    function expandControls() {
        controlsEl.classList.remove('controls-mini');
        clearTimeout(controlsTimer);
    }

    function resetControlsTimer() {
        expandControls();
        controlsTimer = setTimeout(() => { controlsEl.classList.add('controls-mini'); }, 2500); 
    }

    window.addEventListener('scroll', resetControlsTimer, { passive: true });
    window.addEventListener('touchstart', resetControlsTimer, { passive: true });
    controlsEl.addEventListener('mouseenter', expandControls);
    controlsEl.addEventListener('mouseleave', resetControlsTimer);
    controlsEl.addEventListener('touchstart', resetControlsTimer, { passive: true });
    resetControlsTimer(); 

    const sidebar = document.getElementById("articleHeader");
    const infoBtn = document.getElementById("infoToggleBtn");
    let peekTimer;
    let infoMiniTimer;

    function expandInfoButton() {
        infoBtn.classList.remove("mini");
        clearTimeout(infoMiniTimer);
    }

    function resetInfoButtonTimer() {
        if (window.innerWidth >= 1000 || infoBtn.classList.contains("close")) return;
        expandInfoButton();
        infoMiniTimer = setTimeout(() => {
            if (!sidebar.classList.contains("open")) {
                infoBtn.classList.add("mini");
            }
        }, 2500);
    }

    function setInfoDrawer(open) {
        sidebar.classList.toggle("open", open);
        infoBtn.classList.toggle("close", open);
        infoBtn.classList.remove("show-tooltip", "mini");
        infoBtn.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-info-circle"></i>';

        if (open) clearTimeout(infoMiniTimer);
        else resetInfoButtonTimer();
    }

    infoBtn.onclick = () => {
        setInfoDrawer(!sidebar.classList.contains("open"));
    };

    infoBtn.addEventListener("mouseenter", expandInfoButton);
    infoBtn.addEventListener("mouseleave", resetInfoButtonTimer);
    infoBtn.addEventListener("touchstart", resetInfoButtonTimer, { passive: true });
    window.addEventListener("scroll", resetInfoButtonTimer, { passive: true });
    resetInfoButtonTimer();

    window.addEventListener("scroll", () => { 
        let isScrolled = window.scrollY > 40;
        document.body.classList.toggle("is-scrolled", isScrolled); 
        document.getElementById("museumHeader").classList.toggle("header-small", isScrolled); 
        
        if(sidebar.classList.contains("open") && window.scrollY > 50) {
            setInfoDrawer(false);
            clearTimeout(peekTimer);
        }
    }, { passive: true });

    
    function triggerMobilePeek() {
        if(window.innerWidth >= 1000) return;
        
        clearTimeout(peekTimer);
        setInfoDrawer(true);
        
        peekTimer = setTimeout(() => {
            if(sidebar.classList.contains("open")) {
                setInfoDrawer(false);
                
                setTimeout(() => {
                    infoBtn.classList.add("show-tooltip");
                    setTimeout(() => {
                        infoBtn.classList.remove("show-tooltip");
                        resetInfoButtonTimer();
                    }, 3000);
                }, 600);
            }
        }, 2500); 
    }

    async function load() {
        try {
            updateThemeIcon();
            const res = await fetch("data/artworks.json", { cache: "default" });
            allArtworks = await res.json();
            let id = new URLSearchParams(location.search).get("id");
            if (!id) {
                let pathName = window.location.pathname.replace(/\/$/, "");
                let fileName = pathName.split('/').pop().replace('.html', '');
                if (fileName && fileName !== "c" && fileName !== "Q") id = fileName;
            }
            if (!allArtworks || allArtworks.length === 0) return;
            const finalId = id || allArtworks[0].id;
            initPiece(finalId);
            if (window.location.search.includes("id=")) {
                window.history.replaceState({id: finalId}, '', finalId);
            }
        } catch(e) { console.error(e); }
    }

    function initPiece(id) {
        if (!allArtworks || allArtworks.length === 0) return;
        let targetId = String(id).trim().toUpperCase(); 
        artwork = allArtworks.find(a => a.id && String(a.id).trim().toUpperCase() === targetId);
        if(!artwork) artwork = allArtworks[0];
        if(!artwork) return;

        if (typeof gtag === 'function') {
            let actualId = String(artwork.id).toUpperCase();
            if (!actualId.startsWith('VN')) {
                if (actualId.startsWith('V')) gtag('event', 'view_craft_video', { 'video_id': actualId, 'video_title': artwork.title_ar || artwork.title_en });
                else gtag('event', 'view_artifact', { 'artifact_id': actualId, 'artifact_title': artwork.title_ar || artwork.title_en });
            }
        }
        
        if(sidebar.classList.contains("open")) setInfoDrawer(false);

        renderArticle();
        updateNavButtons();
        document.getElementById('mainContainer').classList.add('ready');

        if (window.innerWidth < 1000) {
            const firstImg = document.querySelector('#heroSection img');
            if (firstImg && !firstImg.complete) {
                const onLoad = () => { triggerMobilePeek(); firstImg.removeEventListener('load', onLoad); };
                firstImg.addEventListener('load', onLoad);
                setTimeout(() => { firstImg.removeEventListener('load', onLoad); triggerMobilePeek(); }, 2000);
            } else {
                setTimeout(triggerMobilePeek, 300);
            }
        }
    }

    function renderArticle() {
        const ar = lang === "ar";
        document.documentElement.dir = ar ? "rtl" : "ltr";
        document.body.className = (ar ? "lang-ar" : "lang-en") + (document.body.classList.contains("dark") ? " dark" : "");
        
        document.getElementById("headerTitle").innerHTML = ar ? "من حياة التحفة" : "From the Life of an Artefact";
        
        let coverBanner = document.getElementById("coverBanner");
        let coverImg = document.getElementById("coverImage");
        
        coverBanner.style.display = "none";
        document.body.classList.remove("has-cover");
        
        coverImg.src = "images/" + artwork.id + "_cover.webp";
        coverImg.onload = () => { coverBanner.style.display = "block"; document.body.classList.add("has-cover"); };
        coverImg.onerror = () => {
            coverImg.src = "images/" + artwork.id + "_cover.jpg";
            coverImg.onload = () => { coverBanner.style.display = "block"; document.body.classList.add("has-cover"); };
            coverImg.onerror = () => {
                 coverImg.src = "images/" + artwork.id + "_cover.png";
                 coverImg.onload = () => { coverBanner.style.display = "block"; document.body.classList.add("has-cover"); };
                 coverImg.onerror = () => { coverBanner.style.display = "none"; document.body.classList.remove("has-cover"); }
            }
        };

        document.getElementById("title").innerHTML = (ar ? artwork.title_ar : artwork.title_en) || "بدون عنوان";
        document.getElementById("from").innerHTML = (ar ? artwork.from_ar : artwork.from_en) || "";
        document.getElementById("date").innerHTML = (ar ? artwork.date_ar : artwork.date_en) || "";
        document.getElementById("material").innerHTML = (ar ? artwork.material_ar : artwork.material_en) || "";
        document.getElementById("dim").innerHTML = (ar ? artwork.dimensions_ar : artwork.dimensions_en) || "";
        document.getElementById("inv").innerHTML = artwork.inventory_number || "";
        document.getElementById("hall").innerHTML = (ar ? artwork.hall_ar : artwork.hall_en) || "";

        // ===== الفيديو والريل: اعرض كل عمود في مكانه حسب حرفه (مش احتياطي) =====
        // slot -1 = فوق | a=0 الهيرو | b..e = 1..4 تحت. أول قيمة لكل خانة تكسب.
        let videoBySlot = {};
        [artwork.video_url, artwork.video_url2, artwork.video_url3].forEach(raw => {
            let p = parseMediaSlot(raw);
            if (p && videoBySlot[p.slot] === undefined) videoBySlot[p.slot] = p.url;
        });
        let reelBySlot = {};
        [artwork.reel_url, artwork.reel_url2, artwork.reel_url3].forEach(raw => {
            let p = parseMediaSlot(raw);
            if (p && reelBySlot[p.slot] === undefined) reelBySlot[p.slot] = p.url;
        });

        let vidContainer = document.getElementById("videoContainer");
        if (videoBySlot[-1]) {
            vidContainer.style.display = "block";
            vidContainer.innerHTML = ytFacade(videoBySlot[-1]);
        } else { vidContainer.style.display = "none"; vidContainer.innerHTML = ""; }

        let reelContainer = document.getElementById("reelContainer");
        if (reelBySlot[-1]) {
            reelContainer.style.display = "block";
            reelContainer.innerHTML = ytFacade(reelBySlot[-1]);
        } else {
            reelContainer.style.display = "none";
            reelContainer.innerHTML = "";
        }

        let potentialImages = [artwork.image1, artwork.image2, artwork.image3, artwork.image4, artwork.image5];
        let images = potentialImages.map(src => src && String(src).trim() !== "" ? String(src).replace(/\.[^/.]+$/, ".webp") : null);

        let heroSection = document.getElementById("heroSection");
        heroSection.innerHTML = "";
        
        if (images[0] || videoBySlot[0] || reelBySlot[0]) {
            let heroFig = document.createElement("figure");
            heroFig.className = "main-figure";
            if (videoBySlot[0]) {
                let vWrap = document.createElement("div"); vWrap.className = "video-container inline-video"; vWrap.style.display = "block"; vWrap.style.width = "100%";
                vWrap.innerHTML = ytFacade(videoBySlot[0]);
                heroFig.appendChild(vWrap);
            } else if (reelBySlot[0]) {
                let rWrap = document.createElement("div"); rWrap.className = "reel-container"; rWrap.style.display = "block";
                rWrap.innerHTML = ytFacade(reelBySlot[0]);
                heroFig.appendChild(rWrap);
            } else if (images[0]) {
                let viewer = document.createElement("div"); viewer.className = "viewer";
                let img = document.createElement("img"); img.src = images[0];
                img.onerror = function() { this.closest('.viewer').style.display = 'none'; };
                img.onclick = () => openModal(img.src);
                viewer.appendChild(img);
                setTimeout(() => { img.style.opacity = 1; }, 50);
                heroFig.appendChild(viewer);
            }
            let capText = (artwork[`info_${lang}1`] || "").trim();
            if (capText) {
                let cap = document.createElement("figcaption"); cap.className = "photo-credit"; cap.innerHTML = capText;
                heroFig.appendChild(cap);
            }
            heroSection.appendChild(heroFig);
        }

        let articleBody = document.getElementById("articleBody");
        articleBody.innerHTML = "";
        
        const splitDescParts = Array.from({ length: 5 }, (_, i) => {
            return (ar ? artwork[`dsc_ar${i + 1}`] : artwork[`dsc_en${i + 1}`]) || "";
        });

        const hasSplitDesc = splitDescParts.some(text => text.trim() !== "");
        let mainDesc = (ar ? artwork.desc_ar : artwork.desc_en) || "";

        if (!hasSplitDesc && mainDesc.trim() !== "") {
            let pMain = document.createElement("p");

    function parseMediaSlot(raw) {
        let v = String(raw || "").trim();
        if (v === "") return null;
        let slot = -1;
        let fc = v.charAt(0).toLowerCase();
        if (['a', 'b', 'c', 'd', 'e'].includes(fc) && v.length > 1 && (v.charAt(1) === 'h' || v.charAt(1) === '<')) {
            slot = fc.charCodeAt(0) - 97; v = v.substring(1).trim();
        }
        let url = v;
        if (v.includes("<iframe") && v.includes("src=")) {
            let m = v.match(/src="([^"]+)"/); if (m) url = m[1];
        } else {
            let yt = v.match(/(?:shorts\/|youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);
            if (yt) url = "https://www.youtube.com/embed/" + yt[1];
        }
        return { slot: slot, url: url };
    }

    // ================= ثامنيل يوتيوب (facade) =================
    function ytVideoId(embedUrl) {
        let m = String(embedUrl || "").match(/embed\/([A-Za-z0-9_-]+)/);
        return m ? m[1] : "";
    }
    function ytFacade(embedUrl) {
        let id = ytVideoId(embedUrl);
        if (!id) return `<iframe src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`;
        let thumb = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
        return `<button type="button" class="yt-facade" data-embed="${embedUrl}" aria-label="Play video" style="background-image:url('${thumb}')"><span class="yt-play"></span></button>`;
    }
    // الكليك على الثامنيل: يستبدله بمشغّل inline بأوتوبلاي (في نفس الصفحة)
    document.addEventListener("click", function(e) {
        let f = e.target.closest ? e.target.closest(".yt-facade") : null;
        if (!f) return;
        let embed = f.getAttribute("data-embed") || "";
        let sep = embed.indexOf("?") >= 0 ? "&" : "?";
        let ifr = document.createElement("iframe");
        ifr.src = embed + sep + "autoplay=1";
        ifr.setAttribute("frameborder", "0");
        ifr.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
        ifr.setAttribute("allowfullscreen", "");
        ifr.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;border:none;";
        f.replaceWith(ifr);
        if (typeof gtag === "function") gtag("event", "play_video_inline", { artifact_id: artwork ? artwork.id : "unknown", video_id: ytVideoId(embed) });

    // حوّل SVG اللوجو لـ PNG قبل التصوير (عشان html2canvas يرسمه مضمون)
    function pdfRasterize(src, h) {
        return new Promise(function(res){
            let im = new Image(); im.crossOrigin = "anonymous";
            im.onload = function(){
                try {
                    let arr = (im.naturalWidth && im.naturalHeight) ? im.naturalWidth / im.naturalHeight : 1;
                    let w = Math.max(1, Math.round(h * arr));
                    let c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
                    c.getContext("2d").drawImage(im, 0, 0, w * 2, h * 2);
                    res('<img src="' + c.toDataURL("image/png") + '" style="height:' + h + 'px;width:auto;display:block;">');
                } catch(e){ res('<img src="' + src + '" style="height:' + h + 'px;width:auto;display:block;">'); }
            };
            im.onerror = function(){ res(""); };
            im.src = src;
        });
    }
    // بنّاء الفيديو: صورة قابلة للضغط تفتح يوتيوب (لينك حقيقي)
    function prVid(u, imgSrc){ let id = ytVideoId(u); if(!id) return ""; let thumb = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"; if (imgSrc) thumb = imgSrc(thumb); return '<a class="pr-vid" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener"><img src="' + thumb + '"><span class="pr-play"></span></a>'; }

    // بنّاء محتوى القطعة (مشترك بين HTML و PDF). imgSrc(url) بترجّع الرابط المستخدم (نسبي أو data-uri)
    function prBuildContent(ar, imgSrc) {
        let src = imgSrc || function(u){ return u; };
        let vBy = {}, rBy = {};
        [artwork.video_url, artwork.video_url2, artwork.video_url3].forEach(function(raw){ let p = parseMediaSlot(raw); if (p && vBy[p.slot] === undefined) vBy[p.slot] = p.url; });
        [artwork.reel_url, artwork.reel_url2, artwork.reel_url3].forEach(function(raw){ let p = parseMediaSlot(raw); if (p && rBy[p.slot] === undefined) rBy[p.slot] = p.url; });
        let imgs = [artwork.image1, artwork.image2, artwork.image3, artwork.image4, artwork.image5].map(function(s){ return s && String(s).trim() !== "" ? String(s).replace(/\.[^/.]+$/, ".webp") : null; });
        function cap(i){ let s = (artwork["info_" + lang + (i + 1)] || "").trim(); return s ? '<div class="pr-cap">' + s + '</div>' : ""; }
        function fig(u, i){ return '<figure class="pr-fig"><img src="' + src(u) + '">' + cap(i) + '</figure>'; }
        let head = '<div class="pr-header"><div class="pr-section">' + (ar ? "من حياة التحفة" : "From the Life of an Artefact") + '</div>' +
            '<div class="pr-logos"><img src="' + src("images/logo-v-teal.svg") + '"><img src="' + src("images/logo-mia.svg") + '"></div></div>';
        let metaLines = [
            ar ? artwork.from_ar : artwork.from_en, ar ? artwork.date_ar : artwork.date_en,
            ar ? artwork.material_ar : artwork.material_en, ar ? artwork.dimensions_ar : artwork.dimensions_en,
            ar ? artwork.hall_ar : artwork.hall_en
        ].filter(function(x){ return x && String(x).trim() !== ""; }).map(function(x){ return '<div>' + x + '</div>'; }).join("");
        let meta = '<div class="pr-meta"><h1 class="pr-title">' + ((ar ? artwork.title_ar : artwork.title_en) || "") + '</h1>' +
            '<div class="pr-rule"></div><div class="pr-metalines">' + metaLines + '</div>' +
            (artwork.inventory_number ? '<div class="pr-rule" style="margin-top:14px;"></div><div class="pr-inv">' + artwork.inventory_number + '</div>' : "") + '</div>';
        let body = "";
        if (vBy[-1]) body += prVid(vBy[-1], src);
        if (rBy[-1]) body += prVid(rBy[-1], src);
        if (vBy[0]) body += prVid(vBy[0], src);
        else if (rBy[0]) body += prVid(rBy[0], src);
        else if (imgs[0]) body += fig(imgs[0], 0);
        let dsc = [];
        for (let i = 0; i < 5; i++) dsc.push((ar ? artwork["dsc_ar" + (i + 1)] : artwork["dsc_en" + (i + 1)]) || "");
        let hasSplit = dsc.some(function(t){ return t.trim() !== ""; });
        let mainDesc = (ar ? artwork.desc_ar : artwork.desc_en) || "";
        if (!hasSplit && mainDesc.trim() !== "") body += '<p>' + mainDesc.replace(/\n/g, '<br>') + '</p>';
        for (let i = 0; i < 5; i++) {
            let pT = dsc[i] || "";
            if (i === 0) { if (hasSplit && pT.trim() !== "") body += '<p>' + pT.replace(/\n/g, '<br>') + '</p>'; }
            else {
                if (vBy[i]) body += prVid(vBy[i], src);
                else if (rBy[i]) body += prVid(rBy[i], src);
                else if (imgs[i]) body += fig(imgs[i], i);
                if (hasSplit && pT.trim() !== "") body += '<p>' + pT.replace(/\n/g, '<br>') + '</p>';
            }
        }
        return { head: head, meta: meta, body: '<div class="pr-body">' + body + '</div>', imgUrls: imgs };
    }

    // تحميل صفحة HTML مستقلة (صور مدمجة) — عربي سليم + لينكات شغّالة + من غير Print
    function inlineDataURL(url) {
        return fetch(url, { mode: "cors" }).then(function(r){ return r.blob(); }).then(function(b){
            return new Promise(function(res){ let fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ res(url); }; fr.readAsDataURL(b); });
        }).catch(function(){ return url; });
    }
    async function downloadHTML() {
        closeDownloadMenu();
        if (!artwork) return;
        let ar = lang === "ar";
        let urls = {};
        urls["images/logo-v-teal.svg"] = 1; urls["images/logo-mia.svg"] = 1; urls["images/pattern-teal.svg"] = 1;
        prBuildContent(ar, null).imgUrls.forEach(function(u){ if (u) urls[u] = 1; });
        [artwork.video_url, artwork.video_url2, artwork.video_url3, artwork.reel_url, artwork.reel_url2, artwork.reel_url3].forEach(function(raw){ let p = parseMediaSlot(raw); if (p) { let id = ytVideoId(p.url); if (id) urls["https://img.youtube.com/vi/" + id + "/hqdefault.jpg"] = 1; } });
        let urlArr = Object.keys(urls);
        let dataArr = await Promise.all(urlArr.map(inlineDataURL));
        let map = {}; urlArr.forEach(function(u, i){ map[u] = dataArr[i]; });
        let src = function(u){ return map[u] || u; };
        let c = prBuildContent(ar, src);
        let patternURI = map["images/pattern-teal.svg"] || "";
        let css =
            "body{margin:0;background:#EAE8D8;color:#06444C;font-family:'Tajawal',sans-serif;font-weight:500;}" +
            "#w{position:relative;max-width:820px;margin:0 auto;padding:26px 20px 60px;box-sizing:border-box;}" +
            "#w::before{content:'';position:fixed;inset:0;background-image:url('" + patternURI + "');background-size:80px 80px;opacity:.05;z-index:-1;}" +
            ".pr-header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #E1A93E;padding-bottom:12px;margin-bottom:22px;}" +
            ".pr-section{font-size:19px;font-weight:800;}.pr-logos{display:flex;align-items:center;gap:14px;flex-shrink:0;}.pr-logos img{height:42px;width:auto;}" +
            ".pr-title{font-size:26px;font-weight:900;color:#4A121C;margin:0 0 8px;line-height:1.4;}.pr-rule{border-top:2px solid rgba(225,169,62,.6);width:40px;}" +
            ".pr-meta{margin-bottom:24px;}.pr-metalines{font-size:14px;line-height:1.9;margin-top:12px;}.pr-metalines>div{margin-bottom:6px;}" +
            ".pr-inv{color:#4A121C;font-weight:900;font-size:16px;margin-top:8px;}" +
            ".pr-body p{font-size:16px;line-height:2;margin:0 0 16px;text-align:justify;}" +
            ".pr-fig{margin:0 0 18px;text-align:center;}.pr-fig img{max-width:100%;border-radius:6px;}" +
            ".pr-cap{font-size:12px;opacity:.85;margin-top:6px;text-align:" + (ar ? "right" : "left") + ";border-" + (ar ? "right" : "left") + ":3px solid #E1A93E;padding-" + (ar ? "right" : "left") + ":8px;}" +
            ".pr-vid{display:block;position:relative;max-width:520px;margin:0 auto 18px;text-decoration:none;}.pr-vid img{width:100%;border:2px solid #E1A93E;border-radius:8px;display:block;}" +
            ".pr-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:42px;background:rgba(6,68,76,.72);border-radius:12px;}" +
            ".pr-play::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-38%,-50%);border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent #fff;}";
        let doc = '<!doctype html><html lang="' + (ar ? "ar" : "en") + '" dir="' + (ar ? "rtl" : "ltr") + '"><head><meta charset="UTF-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1">' +
            '<title>' + ((ar ? artwork.title_ar : artwork.title_en) || "NADIM") + '</title>' +
            '<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">' +
            '<style>' + css + '</style></head><body><div id="w">' + c.head + c.meta + c.body + '</div></body></html>';
        let blob = new Blob([doc], { type: "text/html;charset=utf-8" });
        let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = String(artwork.id) + ".html";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        if (typeof gtag === "function") gtag("event", "download_html", { artifact_id: artwork.id });
    }

    load();

    // hook للسيرفر (Vercel /api/pdf): لو pdfmode، ابنِ صفحة الطباعة وبلّغ إنها جاهزة للـ page.pdf()
    (function(){
        if (!new URLSearchParams(location.search).get("pdfmode")) return;
        let tries = 0;
        let iv = setInterval(function(){
            tries++;
            if (typeof artwork !== "undefined" && artwork) {
                clearInterval(iv);
                buildPrintRoot().then(function(){ setTimeout(function(){ window.__printReady = true; }, 250); });
            } else if (tries > 120) { clearInterval(iv); window.__printReady = true; }
        }, 100);
    })();
</script>
