<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="/">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIA Staff Catalogue</title>
<link rel="icon" type="image/svg+xml" href="images/icon-teal.svg?v=2">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --teal: #06444C; --beige: #EAE8D8; --gold: #E1A93E; --aqua: #ADCAC9; --burgundy: #4A121C;
        --offwhite: #F5F1E8; --ink: #1d2b2e; --muted: #5d6b6d; --line: #d6d2bf;
        --ok: #2e7d4f; --warn: #b26a00; --bad: #b3261e; --card: #fffdf7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--beige); color: var(--ink); }
    a { color: var(--teal); }
    header { background: var(--teal); color: var(--offwhite); padding: 18px 16px 14px; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
    header .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 0; }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 800; }
    header .sub { opacity: .75; font-size: .85rem; }
    header .sp { flex: 1; }
    .btn { border: 1px solid var(--line); background: var(--card); color: var(--teal); padding: 6px 12px; border-radius: 8px;
        font: inherit; font-size: .85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    header .btn { background: transparent; color: var(--offwhite); border-color: rgba(255,255,255,.35); }
    .btn:hover { border-color: var(--gold); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px auto; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    .stat b { display: block; font-size: 1.5rem; color: var(--teal); line-height: 1.1; }
    .stat span { font-size: .8rem; color: var(--muted); }
    .stat.bad b { color: var(--bad); }
    .stat.on { outline: 2px solid var(--gold); }

    .tabs { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
    .tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font: inherit; font-size: .9rem; }
    .tab.on { background: var(--teal); color: var(--offwhite); border-color: var(--teal); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters input, .filters select { font: inherit; font-size: .9rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
    .filters input { flex: 1; min-width: 200px; }
    .count { color: var(--muted); font-size: .85rem; align-self: center; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding-bottom: 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .15s; }
    .card:hover { box-shadow: 0 6px 18px rgba(6,68,76,.15); }
    .thumb { height: 170px; background: #f1eee2; display: flex; align-items: center; justify-content: center; position: relative; }
    .thumb img { max-width: 92%; max-height: 92%; object-fit: contain; }
    .thumb .none { color: var(--muted); font-size: .8rem; text-align: center; padding: 10px; }
    .idb { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--teal); color: #fff; font-weight: 800; font-size: .8rem; padding: 2px 8px; border-radius: 6px; direction: ltr; }
    .cb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .cb .t { font-weight: 800; color: var(--burgundy); font-size: .98rem; }
    .cb .m { font-size: .78rem; color: var(--muted); }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 6px; }
    .bd { font-size: .72rem; padding: 2px 7px; border-radius: 999px; background: #eef3f2; color: var(--teal); border: 1px solid #d5e3e1; white-space: nowrap; }
    .bd.bad { background: #fbeceb; color: var(--bad); border-color: #f0c9c6; }
    .bd.warn { background: #fff4e0; color: var(--warn); border-color: #f2d9a8; }
    .bd.ok { background: #e8f4ec; color: var(--ok); border-color: #c6e3d0; }

    /* detail drawer */
    .shade { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(7,24,29,.45); display: none; z-index: 20; }
    .drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(920px, 100%); background: var(--offwhite); z-index: 21;
        transform: translateX(calc(var(--dir) * 100%)); transition: transform .2s; overflow-y: auto; box-shadow: 0 0 30px rgba(0,0,0,.25); }
    html[dir=rtl] .drawer { --dir: -1; } html[dir=ltr] .drawer { --dir: 1; }
    .drawer.open { transform: none; }
    .dh { position: sticky; top: 0; background: var(--teal); color: var(--offwhite); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 2; }
    .dh h2 { margin: 0; font-size: 1.1rem; flex: 1; min-width: 180px; }
    .dh .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
    .db { padding: 16px; }
    .sec { margin: 0 0 20px; }
    .sec h3 { margin: 0 0 10px; color: var(--teal); font-size: 1rem; border-bottom: 2px solid var(--gold); padding-bottom: 4px; display: inline-block; }
    table.kv { width: 100%; border-collapse: collapse; font-size: .86rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    table.kv td { padding: 6px 10px; border-bottom: 1px solid #eee8d6; vertical-align: top; }
    table.kv td:first-child { color: var(--muted); width: 32%; white-space: nowrap; }
    .lay { display: flex; flex-direction: column; gap: 10px; }
    .blk { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .blk .lbl { font-size: .75rem; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .blk .lbl code { direction: ltr; background: #f1eee2; padding: 1px 6px; border-radius: 4px; color: var(--ink); }
    .blk.miss { border: 2px dashed var(--bad); background: #fff7f6; }
    .blk.txt { background: transparent; border-style: dashed; }
    .pics { display: flex; gap: 10px; justify-content: center; align-items: center; direction: ltr; flex-wrap: wrap; }
    .pics img { max-height: 230px; max-width: 100%; object-fit: contain; background: #f1eee2; border-radius: 6px; cursor: zoom-in; }
    .pics.dbl img { max-width: calc(50% - 6px); }
    .cap { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 6px; }
    .para { font-size: .85rem; line-height: 1.7; color: var(--ink); max-height: 5.2em; overflow: hidden; position: relative; }
    .para.full { max-height: none; }
    .more { font-size: .78rem; color: var(--teal); cursor: pointer; border: 0; background: none; padding: 0; font: inherit; }
    .vid { display: flex; align-items: center; gap: 10px; }
    .vid img { width: 160px; border-radius: 6px; }
    .combs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .comb { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: .78rem; }
    .comb.miss { border: 2px dashed var(--bad); }
    .comb .pics img { max-height: 120px; }
    .comb .pics.dbl img { max-width: calc(50% - 6px); }

    table.rep { width: 100%; border-collapse: collapse; background: var(--card); font-size: .86rem; border: 1px solid var(--line); }
    table.rep th, table.rep td { padding: 7px 10px; border-bottom: 1px solid #eee8d6; text-align: start; vertical-align: top; }
    table.rep th { background: #f1eee2; color: var(--teal); }
    table.rep code { direction: ltr; display: inline-block; }
    .note { font-size: .8rem; color: var(--muted); margin: 6px 0 12px; }

    .zoom { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.85); z-index: 40; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    .zoom img { max-width: 94vw; max-height: 92vh; }
    #loader { text-align: center; padding: 60px 0; color: var(--muted); }
    @media (max-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } .thumb { height: 130px; } table.kv td:first-child { white-space: normal; } }
</style>
</head>
<body>
<header>
    <div class="wrap">
        <div>
            <h1 id="hTitle">كتالوج الفريق: من حياة التحفة</h1>
            <div class="sub" id="hSub">للاستخدام الداخلي لمؤسسة نديم ومتحف الفن الإسلامي</div>
        </div>
        <div class="sp"></div>
        <button class="btn" id="langBtn">English</button>
        <a class="btn" href="/Preface" target="_blank" id="briefBtn">التمهيد</a>
    </div>
</header>

<div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div id="viewGrid">
        <div class="filters">
            <input id="q" type="search" placeholder="بحث بالرقم أو الاسم أو رقم الجرد">
            <select id="fHall"></select>
            <select id="fType"></select>
            <span class="count" id="count"></span>
        </div>
        <div id="loader">جاري التحميل...</div>
        <div class="grid" id="grid"></div>
    </div>
    <div id="viewReport" style="display:none"></div>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>

<script>
(function () {
    const SITE = "https://mia.nadimfoundation.org/";
    let lang = "ar";
    try { if (localStorage.getItem("mia_staff_lang") === "en") lang = "en"; } catch (e) {}
    let DATA = [], FILES = new Set(), FILES_OK = false, PDFS = {}, INFO = [];
    let tab = "grid", quick = "";

    const T = {
        ar: {
            title: "كتالوج الفريق: من حياة التحفة", sub: "للاستخدام الداخلي لمؤسسة نديم ومتحف الفن الإسلامي", other: "English",
            brief: "التمهيد", search: "بحث بالرقم أو الاسم أو رقم الجرد أو المادة", allHalls: "كل القاعات", noHall: "بدون قاعة",
            types: { all: "كل الأنواع", piece: "قطع", group: "مجموعات أمشاط", text: "صفحات نصية", miss: "ناقصها صور", video: "فيها فيديو/ريل", q: "فيها صور q", nopdf: "الـPDF مش جاهز" },
            tabs: { grid: "القطع", report: "تقرير الصور الناقصة", photos: "كل الصور" },
            st: { pieces: "قطعة", groups: "مجموعة أمشاط", combs: "مشط", photos: "صورة مرفوعة", miss: "صورة ناقصة", videos: "فيديو وريل", pdf: "PDF جاهز" },
            loading: "جاري التحميل...", shown: "معروض", of: "من",
            photosB: "صور", pair: "مزدوجة", vids: "فيديو", reels: "ريل", combsB: "مشط", qB: "صور q", pdfOk: "PDF", pdfNo: "PDF ناقص", missB: "ناقص",
            textPage: "صفحة نصية", heroVideo: "بادئة بفيديو", noPhoto: "مفيش صورة",
            open: "افتح الصفحة", openQ: "افتح /q", copy: "انسخ اللينك", copied: "اتنسخ", close: "إغلاق",
            fields: "البيانات", layout: "شكل الصفحة (بالترتيب)", combsT: "الأمشاط في المجموعة", qT: "صور صفحة /q",
            top: "فوق الصورة الرئيسية", hero: "الصورة الرئيسية", slot: "خانة", text: "فقرة", caption: "تعليق الصورة",
            missing: "ناقصة", front: "وش", back: "ضهر", more: "اقرأ أكتر", less: "أقل",
            repTitle: "الصور الناقصة", repNote: "اسم الملف بالظبط زي ما هو مكتوب (الحروف الصغيرة والكبيرة بتفرق). ارفعه webp جوه الفولدر المكتوب، وهيظهر في صفحته في خلال 5 دقايق.",
            repPiece: "القطعة", repFile: "الملف المطلوب", repFolder: "الفولدر", repWhy: "السبب", repNone: "مفيش صور ناقصة.",
            whyHero: "مفيش صورة رئيسية", whyCap: "فيه تعليق صورة من غير صورة", whyComb: "مشط من غير صورة",
            notes: "ملاحظات", noteHeroVid: "مالهاش صورة رئيسية، والصفحة بادئة بفيديو (مقصود)", noteText: "صفحة نصية من غير صور", noteQOnly: "فيه صور موجودة في صفحة /q بس (مقصود لحد ما الإدارة تختار)",
            filesErr: "مقدرتش أقرأ قايمة الصور من GitHub (ممكن تجرب بعد شوية). الصور المعروضة صح، بس عدّ الناقص مش دقيق.",
            f: { inventory_number: "رقم الجرد", from: "المصدر", date: "التاريخ", dimensions: "المقاسات", section: "القسم", hall: "القاعة", material: "المادة",
                 registered: "التسجيل", acquisition: "الاقتناء", catalogue_no: "رقم الكتالوج", catalogue_page: "صفحة الكتالوج", link: "اللينك", qlink: "لينك /q", pdf: "PDF" },
            allPhotos: "كل الصور المرفوعة، مترتبة بالقطعة", photosNote: "اضغط على أي صورة تكبّرها، أو على اسم القطعة تفتح تفاصيلها."
        },
        en: {
            title: "Staff Catalogue: From the Life of an Artefact", sub: "Internal use for NADIM Foundation and the Museum of Islamic Art", other: "العربية",
            brief: "Preface", search: "Search by id, title, inventory no. or material", allHalls: "All halls", noHall: "No hall",
            types: { all: "All types", piece: "Pieces", group: "Comb groups", text: "Text pages", miss: "Missing photos", video: "With video/reel", q: "With q photos", nopdf: "PDF not ready" },
            tabs: { grid: "Pieces", report: "Missing photos report", photos: "All photos" },
            st: { pieces: "pieces", groups: "comb groups", combs: "combs", photos: "photos uploaded", miss: "missing photos", videos: "videos & reels", pdf: "PDFs ready" },
            loading: "Loading...", shown: "shown", of: "of",
            photosB: "photos", pair: "double", vids: "video", reels: "reel", combsB: "combs", qB: "q photos", pdfOk: "PDF", pdfNo: "no PDF", missB: "missing",
            textPage: "Text page", heroVideo: "Starts with a video", noPhoto: "No photo",
            open: "Open page", openQ: "Open /q", copy: "Copy link", copied: "Copied", close: "Close",
            fields: "Data", layout: "Page layout (in order)", combsT: "Combs in this group", qT: "/q page photos",
            top: "Above the main photo", hero: "Main photo", slot: "Slot", text: "Paragraph", caption: "Caption",
            missing: "missing", front: "front", back: "back", more: "Read more", less: "Less",
            repTitle: "Missing photos", repNote: "Use the file name exactly as written (case matters). Upload it as webp into the folder shown; it appears on its page within 5 minutes.",
            repPiece: "Piece", repFile: "File needed", repFolder: "Folder", repWhy: "Reason", repNone: "No missing photos.",
            whyHero: "No main photo", whyCap: "Caption without a photo", whyComb: "Comb without a photo",
            notes: "Notes", noteHeroVid: "No main photo; the page starts with a video (on purpose)", noteText: "Text page without photos", noteQOnly: "Some photos exist only on the /q page (on purpose until management decides)",
            filesErr: "Couldn't read the photo list from GitHub (try again later). Photos shown are correct, but missing counts may be off.",
            f: { inventory_number: "Inventory no.", from: "Provenance", date: "Date", dimensions: "Dimensions", section: "Section", hall: "Hall", material: "Material",
                 registered: "Registered", acquisition: "Acquisition", catalogue_no: "Catalogue no.", catalogue_page: "Catalogue page", link: "Link", qlink: "/q link", pdf: "PDF" },
            allPhotos: "Every uploaded photo, grouped by piece", photosNote: "Click a photo to enlarge it, or a piece name to open its details."
        }
    };
    const t = () => T[lang];
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const strip = s => String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    const L = v => String(v == null ? "" : v).trim();
    const fld = (a, k) => L(a[k + "_" + lang]) || L(a[k + "_" + (lang === "ar" ? "en" : "ar")]);

    // ===== same rules as c.html / exporter =====
    function slotLetter(n) { return n === 1 ? "" : n <= 26 ? String.fromCharCode(96 + n) : "a" + String.fromCharCode(96 + n - 26); }
    function slotCount(a) {
        let n = 5;
        Object.keys(a || {}).forEach(k => { let m = k.match(/^(?:image|info_(?:en|ar)|dsc_(?:en|ar))(\d+)$/); if (m) n = Math.max(n, +m[1]); });
        return n;
    }
    function findFile(base) {
        for (const e of [".webp", ".png", ".jpg", ".jpeg"]) if (FILES.has(base + e)) return base + e;
        return FILES_OK ? null : base + ".webp"; // without the list: assume webp and let the <img> hide itself
    }
    function parseMediaSlot(raw) {
        let v = L(raw); if (!v) return null;
        let slot = -1, fc = v.charAt(0);
        if (fc >= "a" && fc <= "z" && v.length > 1 && (v.charAt(1) === "h" || v.charAt(1) === "<")) { slot = fc.charCodeAt(0) - 97; v = v.slice(1); }
        let m = v.match(/src=["']([^"']+)["']/); if (m) v = m[1];
        let y = v.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|watch\?v=|shorts\/))([\w-]{6,})/);
        return { slot: slot, url: v, yt: y ? y[1] : "" };
    }
    function normInv(inv) { return L(inv).replace(/^Inv\.?\s*no\.?\s*/i, "").replace(/\//g, "-"); }

    // ===== build the info for one artwork =====
    function analyse(a) {
        const id = L(a.id), info = { a: a, id: id, kind: "piece", slots: [], top: [], media: 0, videos: 0, reels: 0, photos: 0, pairs: 0, missing: [], notes: [], combs: [], q: [] };
        ["video_url", "video_url2", "video_url3", "reel_url", "reel_url2", "reel_url3"].forEach(k => {
            let m = parseMediaSlot(a[k]); if (!m) return;
            m.kind = k.indexOf("reel") === 0 ? "reel" : "video"; m.key = k;
            if (m.kind === "reel") info.reels++; else info.videos++;
            if (m.slot < 0) info.top.push(m); else (info["m" + m.slot] = info["m" + m.slot] || []).push(m);
        });
        if (Array.isArray(a.pieces)) {
            info.kind = "group";
            a.pieces.forEach(p => {
                const base = L(p.img), folder = base.replace(/[^/]+$/, ""), inv = normInv(p.inventory_number);
                const front = findFile(base), backs = [];
                ["b", "c", "d", "e"].forEach(x => { let f = FILES_OK ? findFile(base + x) : null; if (f) backs.push(f); });
                const c = { p: p, front: front, backs: backs, inv: inv, folder: folder };
                if (front) info.photos++; if (front && FILES_OK && !FILES.has(front)) {}
                info.photos += backs.length;
                if (!front && FILES_OK) info.missing.push({ file: inv + ".webp", folder: folder, why: "whyComb", inv: L(p.inventory_number) });
                info.combs.push(c);
            });
            return info;
        }
        const n = slotCount(a);
        for (let s = 1; s <= n; s++) {
            const base = "images/" + id + slotLetter(s);
            const file = findFile(base);
            const pair = s <= 26 && file && FILES_OK ? findFile(base + String.fromCharCode(96 + s)) : null;
            const media = info["m" + (s - 1)] || [];
            const slot = { n: s, base: base, file: file, pair: pair, media: media,
                cap: { ar: L(a["info_ar" + s]), en: L(a["info_en" + s]) }, dsc: { ar: L(a["dsc_ar" + s]), en: L(a["dsc_en" + s]) } };
            if (file && FILES_OK) info.photos++; if (pair) { info.photos++; info.pairs++; }
            info.slots.push(slot);
        }
        (a.gallery || []).forEach(g => { info.q.push(g); });
        // what's missing
        const anyFile = info.slots.some(s => s.file && FILES_OK) || info.q.length;
        const anyMedia = info.videos + info.reels > 0;
        if (FILES_OK) {
            const hero = info.slots[0];
            if (!anyFile && !anyMedia) { info.kind = "text"; info.notes.push("noteText"); }
            else {
                if (!hero.file && !hero.media.length) {
                    if (info.top.length) info.notes.push("noteHeroVid");
                    else info.missing.push({ file: id + ".webp", folder: "images/", why: "whyHero" });
                }
                info.slots.slice(1).forEach(s => {
                    if (s.file || s.media.length || !(s.cap.ar || s.cap.en)) return;
                    // door 6: the photo exists only in the /q set (q6q) on purpose
                    if (findFile("images/q" + id + slotLetter(s.n))) { if (info.notes.indexOf("noteQOnly") < 0) info.notes.push("noteQOnly"); return; }
                    info.missing.push({ file: id + slotLetter(s.n) + ".webp", folder: "images/", why: "whyCap", slot: s.n });
                });
            }
        }
        return info;
    }

    // ===== load =====
    async function loadFiles() {
        try {
            const r = await fetch("https://api.github.com/repos/ND-F/Q/git/trees/main?recursive=1", { cache: "no-cache" });
            if (!r.ok) throw 0;
            const j = await r.json();
            (j.tree || []).forEach(x => { if (x.type === "blob" && x.path.indexOf("images/") === 0) FILES.add(x.path); });
            FILES_OK = FILES.size > 0;
        } catch (e) { FILES_OK = false; }
    }
    async function loadPdfs() {
        for (const u of ["https://raw.githubusercontent.com/ND-F/Q/pdfs/manifest.json", "https://cdn.jsdelivr.net/gh/ND-F/Q@pdfs/manifest.json"]) {
            try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) { PDFS = (await r.json()).files || {}; return; } } catch (e) {}
        }
    }
    Promise.all([
        fetch("data/artworks.json?v=" + Date.now()).then(r => r.json()),
        loadFiles(), loadPdfs()
    ]).then(([data]) => {
        DATA = data;
        INFO = DATA.map(analyse);
        $("loader").style.display = "none";
        applyLang();
    }).catch(() => { $("loader").textContent = "Error loading data."; });

    // ===== UI =====
    function applyLang() {
        document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        $("hTitle").textContent = t().title; $("hSub").textContent = t().sub; $("langBtn").textContent = t().other; $("briefBtn").textContent = t().brief;
        $("q").placeholder = t().search;
        const halls = [...new Set(INFO.map(i => fld(i.a, "hall")).filter(Boolean))].sort((x, y) => x.localeCompare(y, undefined, { numeric: true }));
        const hv = $("fHall").value;
        $("fHall").innerHTML = `<option value="">${t().allHalls}</option>` + halls.map(h => `<option>${esc(h)}</option>`).join("") + `<option value="-">${t().noHall}</option>`;
        $("fHall").value = hv;
        const tv = $("fType").value || "all";
        $("fType").innerHTML = Object.keys(t().types).map(k => `<option value="${k}">${t().types[k]}</option>`).join("");
        $("fType").value = tv;
        renderTabs(); renderStats(); render();
    }
    $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("mia_staff_lang", lang); } catch (e) {} applyLang(); if (openId) openDetail(openId); };

    function pdfReady(id) { return !!(PDFS[id + "-ar"] && PDFS[id + "-en"]); }
    function renderStats() {
        const pieces = INFO.filter(i => i.kind === "piece").length, groups = INFO.filter(i => i.kind === "group");
        const combs = groups.reduce((s, g) => s + g.combs.length, 0);
        const photos = INFO.reduce((s, i) => s + i.photos + i.q.length, 0);
        const miss = INFO.reduce((s, i) => s + i.missing.length, 0);
        const vids = INFO.reduce((s, i) => s + i.videos + i.reels, 0);
        const pdf = INFO.filter(i => pdfReady(i.id)).length;
        const S = t().st;
        const items = [[pieces, S.pieces, "piece"], [groups.length, S.groups, "group"], [combs, S.combs, "group"], [photos, S.photos, "photos"],
            [miss, S.miss, "miss", miss ? "bad" : ""], [vids, S.videos, "video"], [pdf + " / " + INFO.length, S.pdf, "nopdf"]];
        $("stats").innerHTML = items.map(x => `<div class="stat ${x[3] || ""}" data-q="${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("") +
            (FILES_OK ? "" : `<div class="stat bad" style="grid-column:1/-1;cursor:default"><span>${t().filesErr}</span></div>`);
        $("stats").querySelectorAll(".stat[data-q]").forEach(el => el.onclick = () => {
            const q = el.dataset.q;
            if (q === "photos") { setTab("photos"); return; }
            if (q === "miss") { setTab("report"); return; }
            setTab("grid"); $("fType").value = q; render();
        });
    }
    function renderTabs() {
        $("tabs").innerHTML = Object.keys(t().tabs).map(k => `<button class="tab ${tab === k ? "on" : ""}" data-t="${k}">${t().tabs[k]}</button>`).join("");
        $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.t));
    }
    function setTab(k) {
        tab = k; renderTabs();
        $("viewGrid").style.display = k === "grid" ? "" : "none";
        $("viewReport").style.display = k === "grid" ? "none" : "";
        if (k === "report") renderReport(); else if (k === "photos") renderAllPhotos(); else render();
    }

    function matches(i) {
        const q = $("q").value.trim().toLowerCase(), h = $("fHall").value, ty = $("fType").value || "all", a = i.a;
        if (q) {
            let hay = [a.id, a.title_ar, a.title_en, a.inventory_number, a.material_en, a.material_ar, a.hall_en, a.hall_ar].join(" ").toLowerCase();
            if (i.combs.length) hay += " " + i.combs.map(c => c.p.inventory_number).join(" ").toLowerCase();
            if (hay.indexOf(q) < 0) return false;
        }
        if (h === "-" && fld(a, "hall")) return false;
        if (h && h !== "-" && fld(a, "hall") !== h) return false;
        if (ty === "piece" && i.kind !== "piece") return false;
        if (ty === "group" && i.kind !== "group") return false;
        if (ty === "text" && i.kind !== "text") return false;
        if (ty === "miss" && !i.missing.length) return false;
        if (ty === "video" && !(i.videos + i.reels)) return false;
        if (ty === "q" && !i.q.length) return false;
        if (ty === "nopdf" && pdfReady(i.id)) return false;
        return true;
    }
    function thumbOf(i) {
        if (i.kind === "group") { const c = i.combs.find(c => c.front); return c ? c.front : null; }
        const h = i.slots[0]; if (h && h.file) return h.file;
        const s = i.slots.find(s => s.file); if (s) return s.file;
        if (i.q.length) return i.q[0].src;
        const m = i.top[0] || (i["m0"] || [])[0]; return m && m.yt ? "https://img.youtube.com/vi/" + m.yt + "/hqdefault.jpg" : null;
    }
    function badges(i) {
        const b = [], x = t();
        if (i.kind === "text") b.push(`<span class="bd">${x.textPage}</span>`);
        if (i.kind === "group") b.push(`<span class="bd">${i.combs.length} ${x.combsB}</span>`);
        if (i.photos) b.push(`<span class="bd">${i.photos} ${x.photosB}</span>`);
        if (i.pairs) b.push(`<span class="bd">${i.pairs} ${x.pair}</span>`);
        if (i.videos) b.push(`<span class="bd">${i.videos} ${x.vids}</span>`);
        if (i.reels) b.push(`<span class="bd">${i.reels} ${x.reels}</span>`);
        if (i.q.length) b.push(`<span class="bd">${i.q.length} ${x.qB}</span>`);
        if (i.notes.indexOf("noteHeroVid") >= 0) b.push(`<span class="bd warn">${x.heroVideo}</span>`);
        if (i.missing.length) b.push(`<span class="bd bad">${i.missing.length} ${x.missB}</span>`);
        b.push(pdfReady(i.id) ? `<span class="bd ok">${x.pdfOk} ✓</span>` : `<span class="bd warn">${x.pdfNo}</span>`);
        return b.join("");
    }
    function render() {
        if (!INFO.length) return;
        const list = INFO.filter(matches);
        $("count").textContent = `${list.length} ${t().of} ${INFO.length}`;
        $("grid").innerHTML = list.map(i => {
            const a = i.a, th = thumbOf(i);
            const title = fld(a, "title") || i.id;
            const meta = [L(a.inventory_number) && L(a.inventory_number) !== i.id ? L(a.inventory_number) : "", fld(a, "hall"), fld(a, "material")].filter(Boolean).map(esc).join(" · ");
            return `<div class="card" data-id="${esc(i.id)}">
                <div class="thumb">${th ? `<img loading="lazy" src="${esc(th)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'${esc(t().noPhoto)}'}))">` : `<div class="none">${t().noPhoto}</div>`}<span class="idb">${esc(i.id)}</span></div>
                <div class="cb"><div class="t">${esc(title)}</div><div class="m">${meta}</div><div class="m">${esc(fld(a, "date"))}</div><div class="badges">${badges(i)}</div></div>
            </div>`;
        }).join("");
        $("grid").querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
    }
    ["q", "fHall", "fType"].forEach(k => $(k).addEventListener("input", render));

    // ===== detail =====
    let openId = null;
    function imgTag(src, cls) { return `<img loading="lazy" class="${cls || ""}" src="${esc(src)}" alt="" data-z="${esc(src)}" onerror="this.style.display='none'">`; }
    function paraBlock(txt) {
        if (!txt) return "";
        return `<div class="blk txt"><div class="lbl">${t().text}</div><div class="para">${txt}</div><button class="more">${t().more}</button></div>`;
    }
    function mediaBlock(m, label) {
        const th = m.yt ? `<img src="https://img.youtube.com/vi/${m.yt}/mqdefault.jpg" alt="">` : "";
        return `<div class="blk"><div class="lbl">${label} · ${m.kind === "reel" ? t().reels : t().vids} <code>${m.key}</code></div>
            <div class="vid">${th}<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a></div></div>`;
    }
    function fileLabel(f) { return f ? `<code>${esc(f.replace(/^images\//, ""))}</code>` : ""; }
    function openDetail(id) {
        const i = INFO.find(x => x.id === id); if (!i) return; openId = id;
        const a = i.a, x = t(), F = x.f;
        const link = SITE + i.id, qlink = SITE + "q" + i.id;
        let rows = [];
        const add = (k, v) => { v = L(v); if (v) rows.push(`<tr><td>${k}</td><td>${v}</td></tr>`); };
        add(F.inventory_number, esc(a.inventory_number));
        ["from", "date", "dimensions", "section", "hall", "material", "registered", "acquisition"].forEach(k => add(F[k], esc(fld(a, k))));
        add(F.catalogue_no, esc(a.catalogue_no)); add(F.catalogue_page, esc(a.catalogue_page));
        add(F.link, `<a href="${link}" target="_blank">${link}</a>`);
        add(F.qlink, `<a href="${qlink}" target="_blank">${qlink}</a>`);
        const pa = PDFS[i.id + "-ar"], pe = PDFS[i.id + "-en"];
        add(F.pdf, [pa ? `AR ✓ (${Math.round(pa.bytes / 1024)} KB)` : "AR ✗", pe ? `EN ✓ (${Math.round(pe.bytes / 1024)} KB)` : "EN ✗"].join(" · "));

        let lay = "";
        if (i.kind === "group") {
            lay += paraBlock(fld(a, "dsc1") || fld(a, "desc"));
            lay = `<div class="sec"><h3>${x.combsT} (${i.combs.length})</h3><div class="combs">` + i.combs.map(c => {
                const p = c.p, pics = [c.front].concat(c.backs).filter(Boolean);
                return `<div class="comb ${c.front ? "" : "miss"}"><div class="pics ${pics.length > 1 ? "dbl" : ""}">${pics.map(s => imgTag(s)).join("") || `<div class="none" style="color:var(--bad)">${x.missing}: <code>${esc(c.inv)}.webp</code></div>`}</div>
                    <div style="margin-top:6px"><b>${esc(p.inventory_number)}</b></div>
                    <div>${esc(fld(p, "dimensions"))}</div><div>${esc(fld(p, "material"))}</div>
                    <div style="color:var(--muted)">${pics.map((s, k) => fileLabel(s) + " " + (k ? x.back : x.front)).join(" · ")}</div></div>`;
            }).join("") + `</div></div>` + (lay ? `<div class="sec"><h3>${x.text}</h3>${lay}</div>` : "");
        } else {
            i.top.forEach(m => lay += mediaBlock(m, x.top));
            i.slots.forEach(s => {
                const lbl = s.n === 1 ? x.hero : x.slot + " " + s.n;
                const cap = s.cap[lang] || s.cap[lang === "ar" ? "en" : "ar"];
                const dsc = s.dsc[lang] || s.dsc[lang === "ar" ? "en" : "ar"] || (s.n === 1 ? fld(a, "desc") : "");
                if (s.media.length) s.media.forEach(m => lay += mediaBlock(m, lbl));
                else if (s.file) {
                    lay += `<div class="blk"><div class="lbl">${lbl} ${fileLabel(s.file)} ${s.pair ? "+ " + fileLabel(s.pair) + " (" + x.pair + ")" : ""}</div>
                        <div class="pics ${s.pair ? "dbl" : ""}">${imgTag(s.file)}${s.pair ? imgTag(s.pair) : ""}</div>${cap ? `<div class="cap">${cap}</div>` : ""}</div>`;
                } else if (FILES_OK && cap && findFile("images/q" + i.id + slotLetter(s.n))) {
                    lay += `<div class="blk txt"><div class="lbl">${lbl} · ${x.noteQOnly} ${fileLabel(findFile("images/q" + i.id + slotLetter(s.n)))}</div><div class="cap">${x.caption}: ${cap}</div></div>`;
                } else if (FILES_OK && cap) {
                    lay += `<div class="blk miss"><div class="lbl">${lbl} · <b style="color:var(--bad)">${x.missing}</b> <code>${esc(i.id + slotLetter(s.n))}.webp</code></div><div class="cap">${x.caption}: ${cap}</div></div>`;
                }
                lay += paraBlock(dsc);
            });
            lay = `<div class="sec"><h3>${x.layout}</h3><div class="lay">${lay}</div></div>`;
            if (i.q.length) lay += `<div class="sec"><h3>${x.qT} (${i.q.length})</h3><div class="combs">` + i.q.map(g =>
                `<div class="comb"><div class="pics">${imgTag(g.src)}</div><div style="color:var(--muted)">${fileLabel(g.src)}</div><div>${esc(L(a["info_" + lang + g.n]))}</div></div>`).join("") + `</div></div>`;
        }
        const notes = i.notes.map(k => `<div class="bd warn" style="display:inline-block;margin:0 0 6px">${x[k]}</div>`).join(" ");
        $("drawer").innerHTML = `<div class="dh"><h2>${esc(i.id)} · ${esc(fld(a, "title"))}</h2>
            <a class="btn" href="${link}" target="_blank">${x.open}</a>${i.kind !== "text" ? `<a class="btn" href="${qlink}" target="_blank">${x.openQ}</a>` : ""}
            <button class="btn" id="cpy">${x.copy}</button><button class="btn" id="cls">✕</button></div>
            <div class="db">${notes}<div class="badges" style="margin-bottom:14px">${badges(i)}</div>
            <div class="sec"><h3>${x.fields}</h3><table class="kv">${rows.join("")}</table></div>${lay}</div>`;
        $("cls").onclick = closeDetail;
        $("cpy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(link); $("cpy").textContent = x.copied; };
        wireDrawer($("drawer"));
        $("drawer").classList.add("open"); $("shade").style.display = "block"; $("drawer").scrollTop = 0;
    }
    function wireDrawer(root) {
        root.querySelectorAll(".para").forEach(p => { const b = p.nextElementSibling; if (p.scrollHeight <= p.clientHeight + 4) b.remove(); else b.onclick = () => { p.classList.toggle("full"); b.textContent = p.classList.contains("full") ? t().less : t().more; }; });
        root.querySelectorAll("img[data-z]").forEach(im => im.onclick = e => { e.stopPropagation(); $("zoomImg").src = im.dataset.z; $("zoom").style.display = "flex"; });
    }
    function closeDetail() { openId = null; $("drawer").classList.remove("open"); $("shade").style.display = "none"; }
    $("shade").onclick = closeDetail;
    $("zoom").onclick = () => { $("zoom").style.display = "none"; };
    document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("zoom").style.display === "flex") $("zoom").style.display = "none"; else closeDetail(); } });

    // ===== reports =====
    function renderReport() {
        const x = t(), rows = [];
        INFO.forEach(i => i.missing.forEach(m => rows.push({ i: i, m: m })));
        const notes = INFO.filter(i => i.notes.length);
        let h = `<h3 style="color:var(--teal)">${x.repTitle} (${rows.length})</h3><div class="note">${x.repNote}</div>`;
        if (!FILES_OK) h += `<div class="note" style="color:var(--bad)">${x.filesErr}</div>`;
        h += rows.length ? `<table class="rep"><tr><th>${x.repPiece}</th><th>${x.repFile}</th><th>${x.repFolder}</th><th>${x.repWhy}</th></tr>` +
            rows.map(r => `<tr><td><a href="#" data-id="${esc(r.i.id)}">${esc(r.i.id)} · ${esc(fld(r.i.a, "title"))}</a>${r.m.inv ? "<br>" + esc(r.m.inv) : ""}</td>
                <td><code>${esc(r.m.file)}</code></td><td><code>${esc(r.m.folder)}</code></td><td>${x[r.m.why]}${r.m.slot ? " (" + x.slot + " " + r.m.slot + ")" : ""}</td></tr>`).join("") + `</table>`
            : `<p>${x.repNone}</p>`;
        if (notes.length) h += `<h3 style="color:var(--teal);margin-top:24px">${x.notes}</h3><table class="rep">` +
            notes.map(i => `<tr><td><a href="#" data-id="${esc(i.id)}">${esc(i.id)} · ${esc(fld(i.a, "title"))}</a></td><td>${i.notes.map(k => x[k]).join("<br>")}</td></tr>`).join("") + `</table>`;
        $("viewReport").innerHTML = h;
        $("viewReport").querySelectorAll("a[data-id]").forEach(el => el.onclick = e => { e.preventDefault(); openDetail(el.dataset.id); });
    }
    function renderAllPhotos() {
        const x = t();
        let h = `<h3 style="color:var(--teal)">${x.allPhotos}</h3><div class="note">${x.photosNote}</div>`;
        INFO.forEach(i => {
            let pics = [];
            if (i.kind === "group") i.combs.forEach(c => [c.front].concat(c.backs).filter(Boolean).forEach(s => pics.push(s)));
            else { i.slots.forEach(s => { if (s.file && (FILES_OK || true)) pics.push(s.file); if (s.pair) pics.push(s.pair); }); i.q.forEach(g => pics.push(g.src)); }
            if (!pics.length) return;
            h += `<div class="sec"><h3><a href="#" data-id="${esc(i.id)}">${esc(i.id)} · ${esc(fld(i.a, "title"))}</a> <span style="color:var(--muted);font-weight:400">(${pics.length})</span></h3>
                <div class="combs">${pics.map(s => `<div class="comb"><div class="pics">${imgTag(s)}</div><div style="color:var(--muted);text-align:center">${fileLabel(s)}</div></div>`).join("")}</div></div>`;
        });
        $("viewReport").innerHTML = h;
        $("viewReport").querySelectorAll("a[data-id]").forEach(el => el.onclick = e => { e.preventDefault(); openDetail(el.dataset.id); });
        wireDrawer($("viewReport"));
    }
})();
</script>
</body>
</html>
